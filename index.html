<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorteo triaje">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sorteo de destino - triaje</title>
<style>
  html,body{margin:0;height:100%;background:#15161a;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:4vh 4vw 6vh;box-sizing:border-box}
  #dest{font-size:9vmin;font-weight:800;min-height:1.3em;text-align:center;letter-spacing:.03em}
  #base{position:relative;transform:perspective(900px) rotateX(28deg) translateY(-11vmin);width:78vmin;height:78vmin;max-width:92vw;max-height:70vh;border-radius:50%;background:radial-gradient(circle at 40% 30%,#f2f4f7 0%,#b9bec6 50%,#8c929b 85%,#d9dde3 100%);box-shadow:0 2vmin 0 #7d838c, 0 3.5vmin 0 #5a5f66, 0 5vmin 4vmin rgba(0,0,0,.6), inset 0 -1.5vmin 2vmin rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
  #base::before{content:"";position:absolute;left:4%;top:4%;width:92%;height:92%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#8a8f96 0%,#4a4e55 60%,#2f3237 100%);box-shadow:0 1vmin 1.5vmin rgba(0,0,0,.5);pointer-events:none}
  #btn{position:relative;width:80%;height:80%;border:none;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ff6b6b 0%,#e10000 55%,#a80000 100%);box-shadow:0 1.2vmin 0 #8a0000, 0 2.4vmin 0 #6e0000, 0 3.6vmin 0 #5c0000, 0 4.8vmin 0 #4a0000, 0 6.5vmin 5vmin rgba(0,0,0,.55), inset 0 0 0 1vmin rgba(255,255,255,.18);
       display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
       -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #btn::before{content:"";position:absolute;left:14%;top:8%;width:58%;height:32%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
  #btn:active{transform:translateY(.6vmin);box-shadow:0 .6vmin 0 #8a0000, 0 1.2vmin 2vmin rgba(0,0,0,.5)}
  #btn.bounce{animation:bounce .4s ease-out}
  @keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.92)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  #icon{display:none}
  #label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.85);font-size:9vmin;font-weight:800;letter-spacing:.02em;text-shadow:0 .6vmin 1.2vmin rgba(122,0,0,.6), 0 0 3vmin rgba(255,255,255,.35);white-space:nowrap;pointer-events:none}
  #label.blink{animation:blink .8s steps(2,start) infinite}
  #icon.blink{animation:blink .8s steps(2,start) infinite}
  @keyframes blink{to{opacity:.15}}
  #mark{position:fixed;right:3vmin;bottom:3vmin;font-size:4vmin;font-weight:700;color:#2f80ed;line-height:1;z-index:2}

  /* Horizontal: texto a la izquierda, botón a la derecha */
  @media (orientation: landscape){
    body{flex-direction:row;justify-content:center;align-items:center;gap:6vw;padding:4vh 6vw}
    #dest{font-size:8vmin;max-width:34vw;text-align:center}
    #base{transform:perspective(900px) rotateX(20deg);width:70vh;height:70vh;max-width:60vw;max-height:70vh}
    #mark{bottom:2vh;right:2vw}
  }
</style>
</head>
<body>
  <div id="dest">Pulsa el botón</div>
  <div id="base"><button id="btn" aria-label="Asignar destino">
    <svg id="icon" viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M42 44a18 18 0 0 1 36 0"/>
      <path d="M28 44a32 32 0 0 1 64 0"/>
      <path d="M50 74V44a10 10 0 0 1 20 0V58a6 6 0 0 1 10 4a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6h-8a6 6 0 0 1-6 6v8q0 8-8 8h-8q-10 0-12-8l-2-12"/>
      <path d="M50 74Q44 68 36 64Q30 60 26 66Q24 72 34 84"/>
    </svg>
    <span id="label">ASIGNAR</span>
  </button></div>
  <div id="mark">S&#776;</div>

<script>
  const SEQ = ["BOX 2", "BOX 3", "BOX 4", "BOX 5", "BOX 6", "BOX 7"];
  let i = 0;
  let locked = false;
  const btn = document.getElementById("btn");
  const dest = document.getElementById("dest");
  const icon = document.getElementById("icon");
  const label = document.getElementById("label");

  icon.classList.add("blink");
  label.classList.add("blink");

  btn.addEventListener("click", () => {
    if (locked) return;
    locked = true;
    dest.textContent = SEQ[i];
    i = (i + 1) % SEQ.length;
    btn.classList.add("bounce");
    icon.classList.remove("blink");
    label.classList.remove("blink");
    btn.addEventListener("animationend", () => btn.classList.remove("bounce"), { once: true });
    setTimeout(() => {
      locked = false;
      icon.classList.add("blink");
      label.classList.add("blink");
    }, 2000);
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
